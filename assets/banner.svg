<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640"
     role="img" aria-label="modernizr — three stages over one codebase: a code property graph with overlaid syntax, control and data edges; the same graph cut at its narrowest boundary; and a proof that a rule in the surviving logic can never fire.">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7d8590"/>
    </marker>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f0b429"/>
    </marker>
  </defs>

  <rect width="1280" height="640" fill="#0b0f16"/>
  <rect x="0" y="0" width="1280" height="3" fill="#f0b429"/>

  <!-- ─────────────────────────── wordmark ─────────────────────────── -->
  <text x="84" y="272" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace"
        font-size="82" font-weight="700" letter-spacing="-2">modernizr</text>
  <rect x="86" y="308" width="92" height="4" fill="#f0b429"/>

  <text x="84" y="368" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="26">
    Some answers are not
  </text>
  <text x="84" y="404" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="26">
    in any one file.
  </text>
  <text x="84" y="444" fill="#7d8590" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="16">
    Build the graph once. Ask it anything.
  </text>

  <g font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="16" fill="#57606a">
    <text x="84" y="500">codebase-recon</text>
    <text x="245" y="500">·</text>
    <text x="266" y="500">code-graph</text>
    <text x="392" y="500">·</text>
    <text x="413" y="500">code-symbolic</text>
  </g>
  <text x="84" y="536" fill="#f0b429" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="16">
    a Claude Code plugin
  </text>

  <!-- ───────────────── stage 1 · one graph, three layers ───────────── -->
  <g transform="translate(604,140) scale(1.28)">
    <text x="88" y="0" fill="#e6edf3" text-anchor="middle"
          font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="17" font-weight="700">map</text>

    <!-- data-flow layer (dotted), control layer (dashed), syntax layer (solid) -->
    <g fill="none" stroke-width="1.6">
      <path d="M30,70 C 60,42 116,42 146,70" stroke="#3fb950" stroke-dasharray="1.5 5" stroke-linecap="round"/>
      <path d="M30,70 L 88,124 L 146,70"   stroke="#58a6ff" stroke-dasharray="6 5"/>
      <path d="M88,44 L 30,70 M88,44 L 146,70 M30,70 L 88,124 M146,70 L 88,124" stroke="#4d5866"/>
    </g>
    <g fill="#0b0f16" stroke="#8b949e" stroke-width="1.8">
      <circle cx="88"  cy="44"  r="7"/>
      <circle cx="30"  cy="70"  r="7"/>
      <circle cx="146" cy="70"  r="7"/>
      <circle cx="88"  cy="124" r="7"/>
    </g>

    <text x="88" y="230" text-anchor="middle"
          font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13"><tspan fill="#8b949e">syntax&#160;&#160;</tspan><tspan fill="#58a6ff">control&#160;&#160;</tspan><tspan fill="#3fb950">data</tspan></text>
    <text x="88" y="249" fill="#f0b429" text-anchor="middle"
          font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13">one graph, all at once</text>
  </g>

  <!-- ───────────────────── stage 2 · cut it ────────────────────────── -->
  <g transform="translate(856,140) scale(1.28)">
    <text x="88" y="0" fill="#e6edf3" text-anchor="middle"
          font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="17" font-weight="700">cut</text>

    <g fill="none" stroke="#4d5866" stroke-width="1.6">
      <path d="M22,52 L 58,84 M22,116 L 58,84 M22,52 L 22,116"/>
      <path d="M154,52 L 118,84 M154,116 L 118,84 M154,52 L 154,116"/>
    </g>
    <!-- the whole boundary funnels through one node -->
    <g fill="none" stroke="#f0b429" stroke-width="2">
      <path d="M58,84 L 118,84"/>
    </g>
    <circle cx="88" cy="84" r="12" fill="none" stroke="#f0b429" stroke-width="1.4" stroke-dasharray="3 3"/>

    <g fill="#0b0f16" stroke="#8b949e" stroke-width="1.8">
      <circle cx="22"  cy="52"  r="7"/><circle cx="22"  cy="116" r="7"/><circle cx="58" cy="84" r="7"/>
      <circle cx="154" cy="52"  r="7"/><circle cx="154" cy="116" r="7"/><circle cx="118" cy="84" r="7"/>
    </g>

    <path d="M88,26 L 88,146" stroke="#f85149" stroke-width="1.6" stroke-dasharray="7 6"/>
    <text x="88" y="230" fill="#7d8590" text-anchor="middle"
          font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13">pulling these apart:</text>
    <text x="88" y="249" fill="#f0b429" text-anchor="middle"
          font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13">one function</text>
  </g>

  <!-- ─────────────────── stage 3 · decide it ───────────────────────── -->
  <!-- reduced diagram for (a AND b) OR c, laid out in levels. The c node has TWO
       parents and there is exactly one terminal per value — that sharing is what
       makes two equal rule sets the identical object, so equality is free. -->
  <g transform="translate(1108,140) scale(1.24)">
    <text x="62" y="0" fill="#e6edf3" text-anchor="middle"
          font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="17" font-weight="700">prove</text>

    <g fill="none" stroke-width="1.6">
      <path d="M56,44 L 30,104"   stroke="#4d5866" stroke-dasharray="5 4"/>
      <path d="M68,42 L 92,74"    stroke="#8b949e"/>
      <path d="M86,84 L 42,108"   stroke="#4d5866" stroke-dasharray="5 4"/>
      <path d="M96,90 L 100,140"  stroke="#8b949e"/>
      <path d="M28,120 L 20,140"  stroke="#4d5866" stroke-dasharray="5 4"/>
      <path d="M42,118 L 90,142"  stroke="#8b949e"/>
    </g>

    <g fill="#0b0f16" stroke="#8b949e" stroke-width="1.8">
      <circle cx="62" cy="36"  r="9"/>
      <circle cx="96" cy="82"  r="9"/>
      <circle cx="34" cy="112" r="9"/>
    </g>
    <g font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5"
       fill="#adbac7" text-anchor="middle">
      <text x="62" y="40">a</text><text x="96" y="86">b</text><text x="34" y="116">c</text>
    </g>

    <rect x="8"  y="142" width="24" height="18" rx="3" fill="#0b0f16" stroke="#f85149" stroke-width="1.6"/>
    <rect x="88" y="142" width="24" height="18" rx="3" fill="#0b0f16" stroke="#3fb950" stroke-width="1.6"/>
    <g font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" text-anchor="middle">
      <text x="20"  y="156" fill="#f85149">0</text>
      <text x="100" y="156" fill="#3fb950">1</text>
    </g>

    <g stroke-width="1.6" fill="none">
      <path d="M20,182 L 40,182" stroke="#8b949e"/>
      <path d="M20,200 L 40,200" stroke="#4d5866" stroke-dasharray="5 4"/>
    </g>
    <g font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#7d8590">
      <text x="48" y="186">1 &#183; taken</text>
      <text x="48" y="204">0 &#183; not</text>
    </g>

    <text x="62" y="238" fill="#7d8590" text-anchor="middle"
          font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13">does the rule fire?</text>
    <text x="62" y="257" fill="#f0b429" text-anchor="middle"
          font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13">checked for all inputs</text>
  </g>

  <!-- flow between the stages: the same graph, transformed -->
  <line x1="812" y1="247" x2="848" y2="247" stroke="#7d8590" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="1062" y1="247" x2="1098" y2="247" stroke="#f0b429" stroke-width="1.6" marker-end="url(#arw)"/>

  <text x="1196" y="592" fill="#4d5866" text-anchor="end"
        font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14">
    joern · networkx · z3 · sympy
  </text>
</svg>
