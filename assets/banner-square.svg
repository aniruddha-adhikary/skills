<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200"
     role="img" aria-label="modernizr — three stages over one codebase, stacked: a code property graph with syntax, control and data edges; the same graph cut at its narrowest boundary; and a proof that a rule in the surviving logic can never fire.">
  <defs>
    <marker id="dn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7d8590"/>
    </marker>
  </defs>

  <rect width="1200" height="1200" fill="#0b0f16"/>
  <rect x="0" y="0" width="1200" height="4" fill="#f0b429"/>

  <!-- ───────────────────────────── header ──────────────────────────── -->
  <text x="96" y="182" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace"
        font-size="96" font-weight="700" letter-spacing="-3">modernizr</text>
  <rect x="98" y="222" width="108" height="5" fill="#f0b429"/>

  <text x="96" y="298" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="34">
    Some answers are not
  </text>
  <text x="96" y="344" fill="#e6edf3" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="34">
    in any one file.
  </text>
  <text x="96" y="392" fill="#7d8590" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="21">
    Build the graph once. Ask it anything.
  </text>

  <!-- ─────────────────────── 1 · locate ────────────────────────────── -->
  <g transform="translate(150,470) scale(1.06)">
    <g fill="none" stroke-width="1.8">
      <path d="M30,70 C 60,42 116,42 146,70" stroke="#3fb950" stroke-dasharray="1.5 5.5" stroke-linecap="round"/>
      <path d="M30,70 L 88,124 L 146,70"     stroke="#58a6ff" stroke-dasharray="7 5"/>
      <path d="M88,44 L 30,70 M88,44 L 146,70 M30,70 L 88,124 M146,70 L 88,124" stroke="#4d5866"/>
    </g>
    <g fill="#0b0f16" stroke="#8b949e" stroke-width="2">
      <circle cx="88" cy="44" r="8"/><circle cx="30" cy="70" r="8"/>
      <circle cx="146" cy="70" r="8"/><circle cx="88" cy="124" r="8"/>
    </g>
  </g>
  <g font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">
    <text x="470" y="516" fill="#e6edf3" font-size="30" font-weight="700">map</text>
    <text x="470" y="562" font-size="22"><tspan fill="#adbac7">syntax&#160;&#160;</tspan><tspan fill="#58a6ff">control&#160;&#160;</tspan><tspan fill="#3fb950">data</tspan></text>
    <text x="470" y="596" fill="#f0b429" font-size="22">one graph, all at once</text>
  </g>

  <line x1="255" y1="640" x2="255" y2="690" stroke="#7d8590" stroke-width="1.8" marker-end="url(#dn)"/>

  <!-- ─────────────────────── 2 · cut ───────────────────────────────── -->
  <g transform="translate(160,712) scale(1.06)">
    <g fill="none" stroke="#4d5866" stroke-width="1.8">
      <path d="M22,52 L 58,84 M22,116 L 58,84 M22,52 L 22,116"/>
      <path d="M154,52 L 118,84 M154,116 L 118,84 M154,52 L 154,116"/>
    </g>
    <path d="M58,84 L 118,84" stroke="#f0b429" stroke-width="2.4" fill="none"/>
    <circle cx="88" cy="84" r="13" fill="none" stroke="#f0b429" stroke-width="1.6" stroke-dasharray="3 3"/>
    <g fill="#0b0f16" stroke="#8b949e" stroke-width="2">
      <circle cx="22" cy="52" r="8"/><circle cx="22" cy="116" r="8"/><circle cx="58" cy="84" r="8"/>
      <circle cx="154" cy="52" r="8"/><circle cx="154" cy="116" r="8"/><circle cx="118" cy="84" r="8"/>
    </g>
    <path d="M88,24 L 88,146" stroke="#f85149" stroke-width="1.8" stroke-dasharray="8 6"/>
  </g>
  <g font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">
    <text x="470" y="770" fill="#e6edf3" font-size="30" font-weight="700">cut</text>
    <text x="470" y="816" fill="#adbac7" font-size="22">pulling these apart:</text>
    <text x="470" y="850" fill="#f0b429" font-size="22">one function</text>
  </g>

  <line x1="255" y1="876" x2="255" y2="926" stroke="#7d8590" stroke-width="1.8" marker-end="url(#dn)"/>

  <!-- ─────────────────────── 3 · decide ────────────────────────────── -->
  <g transform="translate(178,946) scale(1.06)">
    <g fill="none" stroke-width="1.8">
      <path d="M56,44 L 30,104"  stroke="#4d5866" stroke-dasharray="5 4"/>
      <path d="M68,42 L 92,74"   stroke="#8b949e"/>
      <path d="M86,84 L 42,108"  stroke="#4d5866" stroke-dasharray="5 4"/>
      <path d="M96,90 L 100,140" stroke="#8b949e"/>
      <path d="M28,120 L 20,140" stroke="#4d5866" stroke-dasharray="5 4"/>
      <path d="M42,118 L 90,142" stroke="#8b949e"/>
    </g>
    <g fill="#0b0f16" stroke="#8b949e" stroke-width="2">
      <circle cx="62" cy="36" r="10"/><circle cx="96" cy="82" r="10"/><circle cx="34" cy="112" r="10"/>
    </g>
    <g font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13"
       fill="#adbac7" text-anchor="middle">
      <text x="62" y="41">a</text><text x="96" y="87">b</text><text x="34" y="117">c</text>
    </g>
    <rect x="6"  y="142" width="27" height="20" rx="3" fill="#0b0f16" stroke="#f85149" stroke-width="1.8"/>
    <rect x="87" y="142" width="27" height="20" rx="3" fill="#0b0f16" stroke="#3fb950" stroke-width="1.8"/>
    <g font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" text-anchor="middle">
      <text x="19"  y="157" fill="#f85149">0</text>
      <text x="100" y="157" fill="#3fb950">1</text>
    </g>
  </g>
  <g font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">
    <text x="470" y="1004" fill="#e6edf3" font-size="30" font-weight="700">prove</text>
    <text x="470" y="1050" fill="#adbac7" font-size="22">does the rule fire?</text>
    <text x="470" y="1084" fill="#f0b429" font-size="22">checked for all inputs</text>
    <g stroke-width="1.8" fill="none">
      <path d="M470,1114 L 496,1114" stroke="#8b949e"/>
      <path d="M640,1114 L 666,1114" stroke="#4d5866" stroke-dasharray="5 4"/>
    </g>
    <g font-size="18" fill="#7d8590">
      <text x="506" y="1119">1 &#183; taken</text>
      <text x="676" y="1119">0 &#183; not</text>
    </g>
  </g>

  <!-- ───────────────────────────── footer ──────────────────────────── -->
  <rect x="96" y="1146" width="1008" height="1" fill="#21262d"/>
  <text x="96" y="1180" fill="#57606a" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="18">
    codebase-recon &#183; code-graph &#183; code-symbolic
  </text>
  <text x="1104" y="1180" fill="#f0b429" text-anchor="end"
        font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="18">
    a Claude Code plugin
  </text>
</svg>
